# The whole Hooklane system on one laptop. `make up` starts it; only Docker
# is required. Ports on localhost:
#   8080  Hooklane API            8090  sink (fake customer endpoints)
#   3000  Grafana                 9090  Prometheus
#   16686 Jaeger                  8081  Redpanda Console
#   55432 Postgres                19092 Kafka (Redpanda) for native runs

name: hooklane

# Settings shared by every Hooklane role. Each role is the same image with a
# different --role. HOOKLANE_IMAGE lets `make up PREBUILT=1` run the published
# image instead of building one locally.
x-hooklane: &hooklane
  image: ${HOOKLANE_IMAGE:-hooklane:local}
  # Built once by the `migrate` service below; every role reuses that image.
  pull_policy: never
  restart: unless-stopped
  environment: &hooklane-env
    DATABASE_URL: postgres://hooklane:hooklane@postgres:5432/hooklane
    KAFKA_BROKERS: redpanda:9092
    QUEUE_MODE: ${QUEUE_MODE:-kafka}
    SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?run 'make up' (it creates .env with a key)}
    # The sink lives on this private Docker network, so the SSRF IP rules must
    # be off locally. Never do this in production.
    ALLOW_PRIVATE_ENDPOINTS: "true"
    ALLOW_HTTP: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    RETRY_SCHEDULE_MS: ${RETRY_SCHEDULE_MS:-5000,300000,1800000,7200000,18000000,36000000,36000000}
    BREAKER_BASE_COOLDOWN_MS: ${BREAKER_BASE_COOLDOWN_MS:-30000}
    DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
    RUST_LOG: ${RUST_LOG:-info}
  depends_on: &hooklane-deps
    migrate:
      condition: service_completed_successfully
  # Kubernetes-like stop behaviour: SIGTERM, then up to 30 s to drain.
  stop_grace_period: 30s
  # Default container limit is 1024 open files; under load the API holds one
  # socket per client connection (found in the first 100k load test).
  ulimits:
    nofile: {soft: 65536, hard: 65536}

services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: hooklane
      POSTGRES_PASSWORD: hooklane
      POSTGRES_DB: hooklane
    command: >
      postgres -c max_connections=400 -c shared_buffers=512MB
               -c effective_cache_size=1GB -c max_wal_size=1GB
    # Host port 55432 (not 5432) so it never collides with a Postgres
    # already installed on the developer machine.
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooklane -d hooklane"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v26.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=2
      - --memory=1536M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  redpanda-console:
    image: redpandadata/console:v3.14.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8081:8080"]
    depends_on:
      redpanda:
        condition: service_healthy

  # One-shot: run migrations and create the 64-partition topic, then exit.
  migrate:
    image: ${HOOKLANE_IMAGE:-hooklane:local}
    build: .   # the only service that builds the image
    command: ["migrate"]
    environment: *hooklane-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  api:
    <<: *hooklane
    command: ["--role", "api"]
    environment:
      <<: *hooklane-env
      # Every ingest is one durable Postgres transaction, so the pool size caps
      # ingest throughput (20 was the bottleneck in the first load test).
      DATABASE_MAX_CONNECTIONS: ${API_DATABASE_MAX_CONNECTIONS:-64}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  relay:
    <<: *hooklane
    command: ["--role", "relay"]

  scheduler:
    <<: *hooklane
    command: ["--role", "scheduler"]

  worker:
    <<: *hooklane
    command: ["--role", "worker"]

  sink:
    image: ${HOOKLANE_IMAGE:-hooklane:local}
    pull_policy: never
    entrypoint: ["sink"]
    ports: ["8090:8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/compose/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/compose/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.0.13
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hooklane.json
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["16686:16686"]

volumes:
  pgdata:
  redpanda:
