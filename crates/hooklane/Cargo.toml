[package]
name = "hooklane"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
futures = "0.3.34"
hmac = "0.13.0"
httpdate = "1.0.3"
ipnet = "2.12.2"
opentelemetry = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
rand = "0.10.4"
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
regex = "1.13.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
http = "1.5.0"
sink = { path = "../sink" }
standardwebhooks = "1.3.0"
