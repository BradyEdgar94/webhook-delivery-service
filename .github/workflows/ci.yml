name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Runners are pinned to a specific Ubuntu release rather than `ubuntu-latest`:
# librdkafka is compiled from C source, and a silent move to a newer compiler
# should not be able to break the build.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee build.log
      - name: Surface the first error
        if: failure()
        run: .github/first-error.sh build.log

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: hooklane
          POSTGRES_PASSWORD: hooklane
          POSTGRES_DB: hooklane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hooklane"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # Redpanda needs a custom command line, which GitHub service containers
      # do not support, so it is started as a plain container.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v26.2.7 \
            redpanda start --mode=dev-container --smp=1 --memory=1G \
            --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr=internal://localhost:9092,external://localhost:19092
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health | grep -E 'Healthy:.+true' && break
            sleep 2
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --workspace --lib --bins 2>&1 | tee build.log
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://hooklane:hooklane@localhost:5432/postgres
          TEST_KAFKA_BROKERS: localhost:19092
        run: |
          set -o pipefail
          cargo test -p hooklane --test '*' -- --test-threads=4 2>&1 | tee build.log
      - name: Surface the first error
        if: failure()
        run: .github/first-error.sh build.log
