apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {app: worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      # Longer than SHUTDOWN_GRACE_MS (25 s): SIGTERM -> drain -> exit
      # before Kubernetes would SIGKILL.
      terminationGracePeriodSeconds: 40
      containers:
        - name: worker
          image: hooklane
          imagePullPolicy: IfNotPresent
          args: ["--role", "worker"]
          envFrom:
            - configMapRef: {name: hooklane-config}
            - secretRef: {name: hooklane-secrets}
          ports: [{name: health, containerPort: 9000}]
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            # The CPU limit makes each worker a fixed-size unit of capacity,
            # so adding workers visibly adds throughput in the demo.
            limits: {cpu: 300m, memory: 256Mi}
---
# KEDA scales the worker Deployment on Kafka consumer lag: how many messages
# are waiting for this consumer group. Lag directly measures "falling behind";
# CPU does not (a worker waiting on slow endpoints uses little CPU but may be
# far behind). desired replicas ~= total lag / lagThreshold, between min and
# max. Max is capped by partitions: a consumer group cannot use more
# consumers than the topic has partitions (64).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef: {name: worker}
  minReplicaCount: 1
  maxReplicaCount: 64
  pollingInterval: 5
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
          policies: [{type: Percent, value: 50, periodSeconds: 15}]
        scaleUp:
          stabilizationWindowSeconds: 0
          policies: [{type: Pods, value: 4, periodSeconds: 10}]
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: redpanda.hooklane.svc:9092
        consumerGroup: hooklane-workers
        topic: hooklane.deliveries
        lagThreshold: "500"
        offsetResetPolicy: earliest
