apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels: {app: scheduler}
spec:
  replicas: 1
  selector: {matchLabels: {app: scheduler}}
  template:
    metadata: {labels: {app: scheduler}}
    spec:
      # Longer than SHUTDOWN_GRACE_MS (25 s): SIGTERM -> drain -> exit
      # before Kubernetes would SIGKILL.
      terminationGracePeriodSeconds: 40
      containers:
        - name: scheduler
          image: hooklane
          imagePullPolicy: IfNotPresent
          args: ["--role", "scheduler"]
          envFrom:
            - configMapRef: {name: hooklane-config}
            - secretRef: {name: hooklane-secrets}
          ports: [{name: health, containerPort: 9000}]
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
