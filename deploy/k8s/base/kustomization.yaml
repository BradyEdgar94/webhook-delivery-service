# Hooklane on Kubernetes. One image, one Deployment per role (--role differs).
# Apply an overlay, not this base: `kubectl apply -k deploy/k8s/overlays/kind`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hooklane
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redpanda.yaml
  - migrate-job.yaml
  - api.yaml
  - relay.yaml
  - scheduler.yaml
  - worker.yaml
  - sink.yaml
images:
  - name: hooklane
    newName: hooklane
    newTag: local
