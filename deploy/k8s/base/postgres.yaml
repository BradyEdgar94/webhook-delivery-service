# Single Postgres for the local cluster. emptyDir: data does not survive a pod
# restart, which is fine for a demo cluster (the cloud version uses RDS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:18.7-bookworm
          args: ["-c", "max_connections=400", "-c", "shared_buffers=256MB"]
          env:
            - {name: POSTGRES_USER, value: hooklane}
            - {name: POSTGRES_PASSWORD, value: hooklane}
            - {name: POSTGRES_DB, value: hooklane}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "hooklane"]}
            periodSeconds: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
