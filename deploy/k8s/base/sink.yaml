# Fake customer endpoints for the demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
spec:
  replicas: 1
  selector: {matchLabels: {app: sink}}
  template:
    metadata: {labels: {app: sink}}
    spec:
      containers:
        - name: sink
          image: hooklane
          imagePullPolicy: IfNotPresent
          command: ["sink"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 200m, memory: 64Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: sink
spec:
  selector: {app: sink}
  ports: [{port: 8080}]
