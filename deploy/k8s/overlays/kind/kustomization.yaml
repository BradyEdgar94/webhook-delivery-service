# Local kind cluster: cap workers at 16 so a laptop is not overwhelmed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: ScaledObject, name: worker}
    patch: |-
      - op: replace
        path: /spec/maxReplicaCount
        value: 16
